app = "shelf-scanner"
primary_region = "iad"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  NODE_OPTIONS = "--max-old-space-size=160"
  CACHE_PATH = "/data/cache.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[mounts]
  source = "cache"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
